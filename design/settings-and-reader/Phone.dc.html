<style>

.sum{display:flex;align-items:center;gap:10px;min-height:52px;background:none;border:0;padding:0;font-size:22px;color:#1c1a17}

<div style="width: 390px; box-sizing: border-box; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 20px; font-family: 'Atkinson Hyperlegible Next', Verdana, sans-serif; color: #1c1a17; font-size: 24px; line-height: 1.45">
